services:
  - type: web
    name: neoguard-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "8757838567"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: neoguard
      - key: WARN_LIMIT
        value: "3"
